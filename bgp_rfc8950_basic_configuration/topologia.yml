name: rfc8950

topology:
  nodes:
    frr1:
      kind: linux
      image: quay.io/frrouting/frr:10.5.4
      binds:
        - /root/rfc8950/daemons:/etc/frr/daemons
        - /root/rfc8950/r1.cfg:/etc/frr/frr.conf

    frr2:
      kind: linux
      image: quay.io/frrouting/frr:10.5.4
      binds:
        - /root/rfc8950/daemons:/etc/frr/daemons
        - /root/rfc8950/r2.cfg:/etc/frr/frr.conf

    frr3:
      kind: linux
      image: quay.io/frrouting/frr:10.5.4
      binds:
        - /root/rfc8950/daemons:/etc/frr/daemons
        - /root/rfc8950/r3.cfg:/etc/frr/frr.conf

    frr4:
      kind: linux
      image: quay.io/frrouting/frr:10.5.4
      binds:
        - /root/rfc8950/daemons:/etc/frr/daemons
        - /root/rfc8950/r4.cfg:/etc/frr/frr.conf
   
    frr5:
      kind: linux
      image: quay.io/frrouting/frr:10.5.4
      binds:
        - /root/rfc8950/daemons:/etc/frr/daemons
        - /root/rfc8950/r5.cfg:/etc/frr/frr.conf       
       
    vpc1:
      kind: linux
      image: wbitt/network-multitool:latest

  links:
    # Cliente 1 <-> Transit
    - endpoints: ["frr1:eth1", "frr4:eth1"]

    # Cliente 2 <-> Transit
    - endpoints: ["frr2:eth1", "frr4:eth2"]

    # Cliente 3 <-> Transit
    - endpoints: ["frr3:eth1", "frr4:eth3"]
    
    # Google <-> Transit
    - endpoints: ["frr5:eth1", "frr4:eth4"]  

   # VPC <-> FRR2
    - endpoints: ["vpc1:eth1", "frr2:eth2"]
