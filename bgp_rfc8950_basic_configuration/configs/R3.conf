frr version 8.4_git
frr defaults traditional
hostname R3
!
interface eth1
 description "Link to R2"
 ipv6 address 2001:db8:0:3::2/64
exit
!
interface eth2
 description "Link to C2"
 ipv6 address 2001:db8:0:5::1/64
exit
!
interface lo
 ipv6 address 2001:db8:beba:3:3:3:3:3/128
exit
!
router bgp 65501
 no bgp ebgp-requires-policy
 neighbor 2001:db8:0:5::2 remote-as 64513
 neighbor 2001:db8:0:5::2 description CLI-POP-B-AS64513
 neighbor 2001:db8:0:5::2 update-source 2001:db8:0:5::1
 neighbor 2001:db8:0:5::2 capability extended-nexthop
 neighbor 2001:db8:beba:1:1:1:1:1 remote-as 65501
 neighbor 2001:db8:beba:1:1:1:1:1 description IBGP-R1
 neighbor 2001:db8:beba:1:1:1:1:1 update-source lo
 neighbor 2001:db8:beba:1:1:1:1:1 capability extended-nexthop
 neighbor 2001:db8:beba:2:2:2:2:2 remote-as 65501
 neighbor 2001:db8:beba:2:2:2:2:2 description IBGP-R2
 neighbor 2001:db8:beba:2:2:2:2:2 update-source lo
 neighbor 2001:db8:beba:2:2:2:2:2 capability extended-nexthop
 !
 address-family ipv6 unicast
  neighbor 2001:db8:0:5::2 activate
  neighbor 2001:db8:beba:1:1:1:1:1 activate
  neighbor 2001:db8:beba:2:2:2:2:2 activate
 exit-address-family
exit
!
