frr version 8.4_git
frr defaults traditional
hostname C2
no ipv6 forwarding
!
interface eth0
 shutdown
exit
!
interface eth1
 description "Link to R3"
 ipv6 address 2001:db8:0:5::2/64
exit
!
interface lo
 ip address 10.2.2.1/24
 ip address 192.168.2.1/24
exit
!
router bgp 64513
 bgp router-id 10.2.2.1
 no bgp ebgp-requires-policy
 neighbor 2001:db8:0:5::1 remote-as 65501
 neighbor 2001:db8:0:5::1 description R3
 neighbor 2001:db8:0:5::1 update-source 2001:db8:0:5::2
 neighbor 2001:db8:0:5::1 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 10.2.2.0/24
  network 192.168.2.0/24
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 2001:db8:0:5::1 activate
 exit-address-family
exit
!
