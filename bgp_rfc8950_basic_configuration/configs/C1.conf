frr version 8.4_git
frr defaults traditional
hostname C1
no ipv6 forwarding
!
interface eth0
 shutdown
exit
!
interface eth1
 description "Link to R1"
 ipv6 address 2001:db8:0:1::2/64
exit
!
interface lo
 ip address 10.0.0.1/24
 ip address 192.168.1.1/24
exit
!
router bgp 64512
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 2001:db8:0:1::1 remote-as 65501
 neighbor 2001:db8:0:1::1 description R1
 neighbor 2001:db8:0:1::1 update-source eth1
 neighbor 2001:db8:0:1::1 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 10.0.0.0/24
  network 192.168.1.0/24
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor 2001:db8:0:1::1 activate
 exit-address-family
exit
!
