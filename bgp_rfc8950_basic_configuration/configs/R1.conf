frr version 8.4_git
frr defaults traditional
hostname R1
!
interface eth1
 description CLI-POP-A
 ipv6 address 2001:db8:0:1::1/64
exit
!
interface eth2
 description CORE-LAN-R2
 ipv6 address 2001:db8:0:2::1/64
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 network point-to-point
exit
!
interface lo
 ip address 1.1.1.1/32
 ipv6 address 2001:db8:beba:1:1:1:1:1/128
 ipv6 ospf6 area 0.0.0.0
exit
!
router bgp 65501
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 neighbor 2001:db8:0:1::2 remote-as 64512
 neighbor 2001:db8:0:1::2 update-source eth1
 neighbor 2001:db8:0:1::2 capability extended-nexthop
 neighbor 2001:db8:beba:2:2:2:2:2 remote-as 65501
 neighbor 2001:db8:beba:2:2:2:2:2 update-source lo
 neighbor 2001:db8:beba:2:2:2:2:2 capability extended-nexthop
 neighbor 2001:db8:beba:3:3:3:3:3 remote-as 65501
 neighbor 2001:db8:beba:3:3:3:3:3 update-source lo
 neighbor 2001:db8:beba:3:3:3:3:3 capability extended-nexthop
 !
 address-family ipv6 unicast
  neighbor 2001:db8:0:1::2 activate
  neighbor 2001:db8:beba:2:2:2:2:2 activate
  neighbor 2001:db8:beba:3:3:3:3:3 activate
 exit-address-family
exit
!
router ospf6
 ospf6 router-id 1.1.1.1
 redistribute connected
exit
!
