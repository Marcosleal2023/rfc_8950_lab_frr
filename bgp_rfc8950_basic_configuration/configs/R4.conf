frr version 10.5.4_git
frr defaults traditional
hostname frr4
!
interface eth1
 ipv6 address 2001:db8:beba:cafe::1/126
exit
!
interface eth2
 ipv6 address 2001:db8:beba:cafe::5/126
exit
!
interface eth3
 ipv6 address 2001:db8:beba:cafe::9/126
exit
!
interface eth4
 ipv6 address 2001:db8:beba:c0ca::1/126
exit
!
interface lo
 ip address 65.0.0.1/32
exit
!
router bgp 6500
 bgp router-id 65.0.0.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 2001:db8:beba:c0ca::2 remote-as 15169
 neighbor 2001:db8:beba:c0ca::2 description WAN-GGC-AS15169
 neighbor 2001:db8:beba:c0ca::2 capability extended-nexthop
 neighbor 2001:db8:beba:cafe::2 remote-as 65001
 neighbor 2001:db8:beba:cafe::2 description CLI-ASN-65001
 neighbor 2001:db8:beba:cafe::2 capability extended-nexthop
 neighbor 2001:db8:beba:cafe::6 remote-as 65002
 neighbor 2001:db8:beba:cafe::6 description CLI-ASN-65002
 neighbor 2001:db8:beba:cafe::6 capability extended-nexthop
 neighbor 2001:db8:beba:cafe::a remote-as 65003
 neighbor 2001:db8:beba:cafe::a description CLI-ASN-65003
 neighbor 2001:db8:beba:cafe::a capability extended-nexthop
 !
 address-family ipv4 unicast
  neighbor 2001:db8:beba:c0ca::2 activate
  neighbor 2001:db8:beba:cafe::2 activate
  neighbor 2001:db8:beba:cafe::6 activate
  neighbor 2001:db8:beba:cafe::a activate
 exit-address-family
exit
!
